services:
  # Local dev: Postgres (use Supabase in production)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aria
      POSTGRES_PASSWORD: aria_dev_password
      POSTGRES_DB: aria
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
