name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'packages/shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @aria/shared build && pnpm --filter @aria/db build

      - name: Type check
        run: pnpm --filter @aria/api typecheck

      - name: Build Docker image
        run: docker build -f apps/api/Dockerfile -t aria-api:${{ github.sha }} .

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/aria
            git pull origin main
            docker compose -f infra/docker-compose.production.yml build api
            docker compose -f infra/docker-compose.production.yml up -d api
            docker compose -f infra/docker-compose.production.yml ps
